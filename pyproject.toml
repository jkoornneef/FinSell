[project]
name = "finsell"
version = "0.1.0"
description = "Numerical analysis for pattern detection and signal generation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=16.0",
    "pandas-ta>=0.3.14b",
    "backtrader>=1.9.78",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dashboard = [
    "dash>=2.14",
    "plotly>=5.18",
    "dash-bootstrap-components>=1.5",
]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["finsell*"]
